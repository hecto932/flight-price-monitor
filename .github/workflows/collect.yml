name: collect

on:
  schedule:
    # Lunes y jueves 10:30 UTC = 3:30 a.m. Hermosillo (la rutina corre a las 5:45).
    # GitHub puede retrasar los cron hasta ~1 h; por eso el margen.
    # Opción B (diario): cambia "1,4" por "*" y revisa el presupuesto en el README.
    - cron: "30 10 * * 1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = corrida normal · probe = 1 búsqueda para medir cobertura · plan = solo listar llamadas"
        type: choice
        options: [run, probe, plan]
        default: run

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recolectar precios
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            probe) node src/collect.mjs --probe ;;
            plan)  node src/collect.mjs --plan ;;
            *)     node src/collect.mjs ;;
          esac

      - name: Commit de data/
        # También corre si hubo fallas parciales (exit 1), siempre que haya datos nuevos.
        if: ${{ !cancelled() && (inputs.mode || 'run') == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
            exit 0
          fi
          git commit -m "data: $(TZ=America/Hermosillo date +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
